changelog:
  exclude:
    labels: [skip-changelog]
  categories:
    - title: ⚠️ Breaking changes
      labels: [breaking]
    - title: 🧰 Tools & resources
      labels: [new-tool, enhancement]
    - title: 🐛 Fixes
      labels: [bug]
    - title: 📦 Data refreshes
      labels: [data-refresh]
    - title: 📝 Docs
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
